name: Сборка ЭХО Android APK (Echo Radar)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Загрузка исходного кода проекта
        uses: actions/checkout@v4

      - name: 2. Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Установка Android SDK и Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Сборка отладочного APK (Debug)
        run: |
          gradle assembleDebug --no-daemon

      - name: 5. Переименование APK для удобства
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk echo-radar-debug.apk

      - name: 6. Публикация готового APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: echo-radar-apk
          path: echo-radar-debug.apk
          retention-days: 30
